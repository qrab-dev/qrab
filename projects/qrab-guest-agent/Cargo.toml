[package]
name = "qrab-guest-agent"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Minimal guest-side QEMU guest agent for qrab VMs"

[dependencies]
libc = "0.2"
rustix = { workspace = true, features = ["fs", "process", "system"] }
serde = { workspace = true }
serde_json = { workspace = true }
x509-cert = { version = "0.2", features = ["std"] }

[dependencies.qapi]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }

[dev-dependencies.qapi-protocol]
workspace = true

[dev-dependencies.tokio]
workspace = true
features = ["net", "rt", "macros", "time"]
