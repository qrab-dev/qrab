[workspace]
resolver = "3"
default-members = [
    "projects/manager",
    "projects/bmc",
    "projects/redfish",
    "projects/operator",
    "projects/dashboard",
    "projects/qrab-guest-agent",
    "projects/node-agent",
]
members = [
    "projects/manager",
    "projects/bmc",
    "projects/redfish",
    "projects/operator",
    "projects/dashboard",
    "projects/qrab-guest-agent",
    "projects/node-agent",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1" }
rustix = { version = "1" }
tempfile = "3"
sha2 = { version = "0.10", default-features = false }
# The QAPI crates: the qrab-qapi* packages from crates.io, under their old
# dependency names.
qapi.package = "qrab-qapi"
qapi.version = "0.1.1"
qapi-protocol.package = "qrab-qapi-protocol"
qapi-protocol.version = "0.2.1"
# The workspace's own crates. They are not published, so they need no version.
qrab-guest-agent = { path = "projects/qrab-guest-agent" }
